name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Bundle generation writes back to main; serialize push-triggered jobs to avoid
# concurrent CI runs racing while committing the same generated artifacts.
concurrency:
  group: projectuai-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Build and syntax-check bundle
        run: luajit tools/bundle.lua

      - name: Run headless behavioral suite
        run: luajit test/run.lua

      - name: Run context compaction and token-accounting tests
        run: luajit test/context_compaction.lua

      - name: Run persistent research memory tests
        run: luajit test/research_memory.lua

      - name: Run mobile UI and minimized launcher tests
        run: luajit test/mobile_ui.lua

      - name: Benchmark small, medium, and large transcripts
        run: luajit test/context_benchmark.lua

      - name: Commit the tested generated bundle on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- dist/uai.lua dist/uai.manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/uai.lua dist/uai.manifest.json
            git commit -m "Build dist bundle from tested source"
            git push
          fi

      - name: Require committed bundle to match source
        run: git diff --exit-code -- dist/uai.lua dist/uai.manifest.json
