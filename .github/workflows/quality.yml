name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Build and syntax-check bundle
        run: luajit tools/bundle.lua

      - name: Run headless behavioral suite
        run: luajit test/run.lua

      - name: Run context compaction and token-accounting tests
        run: luajit test/context_compaction.lua

      - name: Require committed bundle to match source
        run: git diff --exit-code -- dist/uai.lua dist/uai.manifest.json
